name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish app image to GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/riskpilot-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the single container (React app + API on one URL) to the Azure Web App.
  # Runs only once the Azure settings below exist in the repo, so it is skipped until then.
  #   Variable: AZURE_WEBAPP_NAME           (Settings > Secrets and variables > Actions > Variables)
  #   Secret:   AZURE_WEBAPP_PUBLISH_PROFILE (publish profile XML downloaded from the Web App)
  # The Web App must be a Linux container app that can pull from GHCR.
  deploy-azure:
    name: Deploy app to Azure Web App
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy container
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.publish-image.outputs.image }}:sha-${{ github.sha }}

  # DISABLED: Azure Static Web Apps is blocked by the sandbox policy. The React app is now
  # built into the container and served by FastAPI from the Azure Web App (deploy-azure).
  # Kept for reference only: `if: false` means it can never run, whatever repo variables
  # are set. To re-enable, restore `if: ${{ vars.DEPLOY_FRONTEND_TO_AZURE == 'true' }}`.
  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps (disabled)
    runs-on: ubuntu-latest
    needs: ci
    if: false
    environment:
      name: production-frontend
    steps:
      - name: Check the backend URL is set
        if: ${{ vars.VITE_API_URL == '' }}
        run: |
          echo "::error::Set the repo variable VITE_API_URL to the backend URL, or the site will call 127.0.0.1"
          exit 1

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
