name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish backend image to GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/riskpilot-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only once the Azure settings below exist in the repo, so it is skipped until then.
  #   Variable: AZURE_WEBAPP_NAME           (Settings > Secrets and variables > Actions > Variables)
  #   Secret:   AZURE_WEBAPP_PUBLISH_PROFILE (publish profile XML downloaded from the Web App)
  # The Web App must be a Linux container app that can pull from GHCR.
  deploy-azure:
    name: Deploy backend to Azure Web App
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy container
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.publish-image.outputs.image }}:sha-${{ github.sha }}
