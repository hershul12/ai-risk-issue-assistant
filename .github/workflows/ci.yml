name: CI

# Pushes to master run CI through cd.yml, so it is not triggered twice.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names)
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -v tests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings fail the build)
        run: npm run lint -- --deny-warnings

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build image (frontend + backend)
        run: docker build -t riskpilot:ci .

      - name: Start container
        run: docker run -d --name riskpilot -p 8000:8000 riskpilot:ci

      - name: Check GET /api/health returns ok
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health | grep -q '"status":"ok"'; then
              echo "API is healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs riskpilot; exit 1

      - name: Check GET / returns the React page
        run: |
          page=$(curl -fsS http://localhost:8000/)
          echo "$page" | grep -q '<div id="root">' || { echo "GET / is not the React page"; echo "$page"; exit 1; }
          asset=$(echo "$page" | grep -o '/assets/[^"]*\.js' | head -n 1)
          test -n "$asset" || { echo "No JS bundle linked from the page"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:8000$asset"
          echo "React page and $asset are served"

      - name: Check unknown API paths stay JSON 404s
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/does-not-exist)
          test "$code" = "404" || { echo "Expected 404, got $code"; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm -f riskpilot || true
